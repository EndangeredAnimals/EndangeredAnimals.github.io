<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="t d">
<title id="t">Where African wild dogs live</title>
<desc id="d">A simplified outline of Africa. Most surviving African wild dog packs live in southern and eastern Africa, in Botswana, Zimbabwe, Zambia and Namibia, with the largest single population in the Selous area of Tanzania. About 6,600 remain, of which roughly 1,400 are mature adults. Fourteen dogs released into Gorongosa National Park in Mozambique have grown to around three hundred.</desc>
<rect width="1000" height="620" fill="#ffffff"/>
<text x="40" y="48" font-family="Georgia, serif" font-size="27" font-weight="600" fill="#1f1f1f">Where African wild dogs live</text>
<text x="40" y="74" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#6f6f6f">Southern and eastern Africa, in a handful of very large places.</text>
<rect x="40" y="96" width="520" height="476" fill="#e3f4fb"/>
