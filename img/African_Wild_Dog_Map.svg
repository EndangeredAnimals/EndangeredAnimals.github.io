<text x="407.4666666666667" y="469.6503382206349" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#8c1515" text-anchor="start">Mozambique</text>
<circle cx="140" cy="424" r="34" fill="#4e2a84"/><text x="140" y="433.86" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6,600</text>
<text x="140" y="474" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#4e2a84" text-anchor="middle">wild dogs, and only</text>
<text x="140" y="489" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4e2a84" text-anchor="middle">about 1,400 of them</text>
<text x="140" y="504" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4e2a84" text-anchor="middle">old enough to breed</text>
<text x="58" y="168" font-family="Georgia, serif" font-size="12.5" font-weight="normal" fill="#2f7fa5" text-anchor="start">Atlantic</text>
<text x="58" y="184" font-family="Georgia, serif" font-size="12.5" font-weight="normal" fill="#2f7fa5" text-anchor="start">Ocean</text>
<text x="552" y="226" font-family="Georgia, serif" font-size="12.5" font-weight="normal" fill="#2f7fa5" text-anchor="end">Indian</text>
<text x="552" y="242" font-family="Georgia, serif" font-size="12.5" font-weight="normal" fill="#2f7fa5" text-anchor="end">Ocean</text>
<text x="604" y="128" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1f1f" text-anchor="start">About 6,600 left</text>
<text x="604" y="154" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">They need enormous space, so almost all</text>
<text x="604" y="173" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">of the packs that remain sit inside a few</text>
<text x="604" y="192" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">very large protected areas rather than</text>
<text x="604" y="211" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">spread across the continent.</text>
<line x1="604" y1="230" x2="944" y2="230" stroke="#e5e5e5" stroke-width="1.5"/>
<text x="604" y="252" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#2f7d4f" text-anchor="start">Fourteen dogs became three hundred</text>
<text x="604" y="276" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">Fourteen wild dogs were released into</text>
<text x="604" y="295" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">Gorongosa National Park in Mozambique,</text>
<text x="604" y="314" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">the first there in decades. A few years</text>
<text x="604" y="333" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">later there were more than a hundred,</text>
<text x="604" y="352" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">and now there are around three hundred.</text>
<text x="604" y="385" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">The Kwando, Linyanti and Okavango</text>
<text x="604" y="403" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">region is one of the best places in the</text>
<text x="604" y="421" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">world to be a wild dog.</text>
<ellipse cx="618" cy="516" rx="13" ry="9" fill="#2f7d4f" fill-opacity="0.22" stroke="#2f7d4f" stroke-width="2"/>
<text x="644" y="521" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#414141" text-anchor="start">Where most surviving packs live</text>
<ellipse cx="618" cy="542" rx="13" ry="9" fill="#8c1515" fill-opacity="0.22" stroke="#8c1515" stroke-width="2"/>
<text x="644" y="547" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#414141" text-anchor="start">A stronghold named in the story</text>
<text x="40" y="596" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c8c">A simplified outline, not to scale. Wild dogs once ranged across nearly the whole continent.</text>
</svg>