<text x="324.0" y="467.0508561359842" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#8c1515" text-anchor="end">and Linyanti</text>
<circle cx="416.1666666666667" cy="394.67529858915475" r="5" fill="#8c1515"/>
<text x="426.1666666666667" y="388.67529858915475" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8c1515" text-anchor="start">Selous, Tanzania</text>
