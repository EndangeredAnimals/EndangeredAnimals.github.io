<text x="191.73770491803282" y="224.01826022114972" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#8a8171" text-anchor="middle">INDIA</text>
<text x="395.7704918032787" y="262.2614126382186" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a8171" text-anchor="middle">SOUTH EAST ASIA</text>
<text x="229.2131147540984" y="367.6425437430306" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8a8171" text-anchor="start">Sri Lanka</text>
<text x="370.78688524590166" y="462.8255008699575" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8a8171" text-anchor="middle">Sumatra</text>
<text x="483.21311475409834" y="428.83158761034076" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8a8171" text-anchor="middle">Borneo</text>
<text x="87.63934426229511" y="177.27662948917663" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a8171" text-anchor="start">ASIA</text>
<circle cx="191.73770491803282" cy="296.25532589783535" r="30" fill="#4e2a84"/><text x="191.73770491803282" y="304.95532589783534" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">half</text>
<text x="191.73770491803282" y="344.25532589783535" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#4e2a84" text-anchor="middle">of every wild Asian</text>
<text x="191.73770491803282" y="359.25532589783535" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4e2a84" text-anchor="middle">elephant on Earth</text>
<text x="191.73770491803282" y="374.25532589783535" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4e2a84" text-anchor="middle">lives in India</text>
<circle cx="215.05573770491804" cy="182.37571647811916" r="5" fill="#8c1515"/>
<text x="225.05573770491804" y="176.37571647811916" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8c1515" text-anchor="start">Bardia, Nepal: from about two</text>
<text x="225.05573770491804" y="190.37571647811916" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#8c1515" text-anchor="start">elephants to more than a hundred</text>
<text x="120.95081967213117" y="449.2279355661109" font-family="Georgia, serif" font-size="13" font-weight="normal" fill="#2f7fa5" text-anchor="middle">Indian Ocean</text>
<text x="604" y="128" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1f1f" text-anchor="start">Roughly 40,000 to 50,000</text>
<text x="604" y="154" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">Their numbers have dropped by at least</text>
<text x="604" y="173" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">half over three generations, and India's</text>
<text x="604" y="192" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">newest count came out lower than the</text>
<text x="604" y="211" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">one before it. This is not a story where</text>
<text x="604" y="230" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">everything is fine.</text>
<line x1="604" y1="249" x2="944" y2="249" stroke="#e5e5e5" stroke-width="1.5"/>
<text x="604" y="271" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#2f7d4f" text-anchor="start">33 Elephant Reserves, and corridors</text>
<text x="604" y="295" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">India began Project Elephant in 1992,</text>
<text x="604" y="314" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">which now supports 33 Elephant</text>
<text x="604" y="333" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">Reserves, and people are protecting the</text>
<text x="604" y="352" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">corridors that connect one patch of</text>
<text x="604" y="371" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">forest to the next, so that herds are</text>
<text x="604" y="390" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">not stuck in one place.</text>
<text x="604" y="423" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">Asian elephants were named India's</text>
<text x="604" y="441" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">National Heritage Animal in 2010, and</text>
<text x="604" y="459" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">Thailand has stopped using elephants</text>
<text x="604" y="477" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">for logging almost everywhere.</text>
<ellipse cx="618" cy="552" rx="13" ry="9" fill="#4e2a84" fill-opacity="0.22" stroke="#4e2a84" stroke-width="2"/>
<text x="644" y="557" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#414141" text-anchor="start">Share of the world population</text>
<text x="40" y="596" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c8c">A simplified outline, not to scale. Asian elephants live in forest across India and South East Asia.</text>
</svg>