<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="t d">
<title id="t">Where Asian elephants live</title>
<desc id="d">A simplified outline of southern and south east Asia. Asian elephants live in forest across thirteen countries, including India, Sri Lanka, Nepal, mainland South East Asia, Sumatra and Borneo. About half of all wild Asian elephants live in India, which runs 33 Elephant Reserves under Project Elephant. Roughly 40,000 to 50,000 remain.</desc>
<rect width="1000" height="620" fill="#ffffff"/>
<text x="40" y="48" font-family="Georgia, serif" font-size="27" font-weight="600" fill="#1f1f1f">Where Asian elephants live</text>
<text x="40" y="74" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#6f6f6f">Thirteen countries, and about half of all of them in just one.</text>
<rect x="40" y="96" width="520" height="476" fill="#e3f4fb"/>
