<text x="88.33333333333333" y="411.99658671049224" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#2f7d4f" text-anchor="middle">have put them back</text>
<path d="M150 391 C172 385 207 354 231 342" stroke="#2f7d4f" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
<circle cx="468" cy="384" r="26" fill="#4e2a84"/><text x="468" y="391.54" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<text x="468" y="428" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#4e2a84" text-anchor="middle">ferrets bred in 1987, and</text>
<text x="468" y="443" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4e2a84" text-anchor="middle">every one of the roughly</text>
<text x="468" y="458" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4e2a84" text-anchor="middle">9,000 since is theirs</text>
<text x="604" y="128" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1f1f" text-anchor="start">About 300 in the wild</text>
<text x="604" y="154" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">This species was declared extinct</text>
<text x="604" y="173" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">twice. By 1987 only 18 were left, all of</text>
<text x="604" y="192" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">them were taken into captivity, and</text>
<text x="604" y="211" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">only 7 of those ever bred.</text>
<line x1="604" y1="230" x2="944" y2="230" stroke="#e5e5e5" stroke-width="1.5"/>
<text x="604" y="252" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#2f7d4f" text-anchor="start">No prairie dogs, no ferrets</text>
<text x="604" y="276" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">Ferrets only live where there are</text>
<text x="604" y="295" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">prairie dog towns, because that is both</text>
<text x="604" y="314" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">their house and their dinner. If the</text>
<text x="604" y="333" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">prairie dogs go, the ferrets cannot</text>
<text x="604" y="352" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">stay.</text>
<text x="604" y="385" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">Scientists have even cloned ferrets</text>
<text x="604" y="403" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">from cells frozen in the 1980s,</text>
<text x="604" y="421" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">including Antonia, who has since had</text>
<text x="604" y="439" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">kits of her own.</text>
<ellipse cx="618" cy="540" rx="13" ry="9" fill="#2f7d4f" fill-opacity="0.22" stroke="#2f7d4f" stroke-width="2"/>
<text x="644" y="545" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#414141" text-anchor="start">A place ferrets were released</text>
<text x="40" y="596" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c8c">A simplified outline, not to scale. The dots are scattered through the prairie to show how many sites there are, not their exact locations.</text>
</svg>