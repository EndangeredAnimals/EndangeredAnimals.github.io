<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="t d">
<title id="t">Where black-footed ferrets live</title>
<desc id="d">A simplified outline of North America. Black-footed ferrets live on the short-grass prairie of the western United States, and only where prairie dog towns survive, because prairie dogs are both their shelter and their food. The dashed band shows the historic prairie range from Canada into Mexico, and the dots mark the roughly 30 sites where ferrets have been released. About 300 live in the wild.</desc>
<rect width="1000" height="620" fill="#ffffff"/>
<text x="40" y="48" font-family="Georgia, serif" font-size="27" font-weight="600" fill="#1f1f1f">Where black-footed ferrets live</text>
<text x="40" y="74" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#6f6f6f">The short-grass prairie, wherever there are still prairie dogs.</text>
<rect x="40" y="96" width="520" height="476" fill="#e3f4fb"/>
