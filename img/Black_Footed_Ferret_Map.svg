<text x="392.3636363636363" y="328.9243897267337" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#d8450b" text-anchor="middle">from Canada down into Mexico</text>
