<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="t d">
<title id="t">Where California condors fly free</title>
<desc id="d">A simplified outline of the west of North America. Four flocks of wild California condors fly today: in central and southern California, in Arizona and Utah, in Baja California in Mexico, and since 2022 over Yurok ancestral territory in far northern California. There are 392 free-flying wild birds and 607 in total, up from 22 birds alive in 1982.</desc>
<rect width="1000" height="620" fill="#ffffff"/>
<text x="40" y="48" font-family="Georgia, serif" font-size="27" font-weight="600" fill="#1f1f1f">Where California condors fly free</text>
<text x="40" y="74" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#6f6f6f">Four flocks, where in 1987 there were none at all.</text>
<rect x="40" y="96" width="520" height="476" fill="#e3f4fb"/>
<clipPath id="cw"><rect x="40" y="96" width="520" height="476"/></clipPath>
