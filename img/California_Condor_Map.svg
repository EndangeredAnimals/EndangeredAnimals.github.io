<text x="364.0977498817793" y="186.0" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#8a8171" text-anchor="middle">UNITED STATES</text>
<text x="428.19549976355864" y="468.2857142857143" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8a8171" text-anchor="middle">MEXICO</text>
<ellipse cx="152" cy="145" rx="20" ry="13" fill="#4e2a84" fill-opacity="0.5" stroke="#4e2a84" stroke-width="2.5"/>
<text x="125.6594931307394" y="136.74285714285716" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#4e2a84" text-anchor="end">far northern California,</text>
<text x="125.6594931307394" y="151.74285714285716" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4e2a84" text-anchor="end">a new flock since 2022</text>
<ellipse cx="225" cy="284" rx="26" ry="20" fill="#4e2a84" fill-opacity="0.5" stroke="#4e2a84" stroke-width="2.5"/>
<text x="192.91406442420146" y="289.71428571428567" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#4e2a84" text-anchor="end">central and southern</text>
<text x="192.91406442420146" y="304.71428571428567" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4e2a84" text-anchor="end">California</text>
<ellipse cx="366" cy="249" rx="22" ry="16" fill="#4e2a84" fill-opacity="0.5" stroke="#4e2a84" stroke-width="2.5"/>
<text x="393.92911416411573" y="250.97142857142853" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#4e2a84" text-anchor="start">Arizona and Utah</text>
<ellipse cx="298" cy="373" rx="13" ry="11" fill="#4e2a84" fill-opacity="0.5" stroke="#4e2a84" stroke-width="2.5"/>
<text x="318.16863571766356" y="380.7428571428572" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#4e2a84" text-anchor="start">Baja California,</text>
<text x="318.16863571766356" y="395.7428571428572" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4e2a84" text-anchor="start">in Mexico</text>
<text x="58" y="300" font-family="Georgia, serif" font-size="12.5" font-weight="normal" fill="#2f7fa5" text-anchor="start">Pacific</text>
<text x="58" y="316" font-family="Georgia, serif" font-size="12.5" font-weight="normal" fill="#2f7fa5" text-anchor="start">Ocean</text>
<text x="604" y="128" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1f1f" text-anchor="start">392 flying free, 607 in all</text>
<text x="604" y="154" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">In 1982 there were 22 California</text>
<text x="604" y="173" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">condors left on Earth. In 1987 biologists</text>
<text x="604" y="192" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">caught every remaining wild bird, and</text>
<text x="604" y="211" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">for five years not one condor flew free</text>
<text x="604" y="230" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">anywhere. Releases began in 1992.</text>
<line x1="604" y1="249" x2="944" y2="249" stroke="#e5e5e5" stroke-width="1.5"/>
<text x="604" y="271" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#2f7d4f" text-anchor="start">Sixteen chicks, no human help</text>
<text x="604" y="295" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">In 2025, sixteen chicks fledged in the</text>
<text x="604" y="314" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">wild without anyone stepping in. That</text>
<text x="604" y="333" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">is the number that matters most.</text>
<text x="604" y="366" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">Lead poisoning is still the leading</text>
<text x="604" y="384" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">known cause of death, but California's</text>
<text x="604" y="402" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">lead ammunition ban took full effect in</text>
<text x="604" y="420" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">2019, and wild deaths fell from 58 in</text>
<text x="604" y="438" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">2023 to 22 in 2025.</text>
<ellipse cx="618" cy="540" rx="13" ry="9" fill="#4e2a84" fill-opacity="0.22" stroke="#4e2a84" stroke-width="2"/>
<text x="644" y="545" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#414141" text-anchor="start">A flock of wild condors</text>
<text x="40" y="596" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c8c">A simplified outline, not to scale. Condors once ranged from British Columbia down into Mexico.</text>
</svg>