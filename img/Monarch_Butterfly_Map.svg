<text x="279.20606060606065" y="481.3003931193605" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#d8450b" text-anchor="start">central Mexico</text>
