<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="t d">
<title id="t">Where monarch butterflies go</title>
<desc id="d">A simplified outline of North America. Monarchs east of the Rocky Mountains migrate south to spend the winter in the fir forests of central Mexico, where the population is measured as the area of forest the butterflies cover: 2.93 hectares in 2025 to 2026, up 64 percent. Monarchs west of the Rockies winter along the coast of California and are counted separately, and their numbers remain very low.</desc>
<rect width="1000" height="620" fill="#ffffff"/>
<text x="40" y="48" font-family="Georgia, serif" font-size="27" font-weight="600" fill="#1f1f1f">Where monarch butterflies go</text>
<text x="40" y="74" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#6f6f6f">Two separate migrations, counted two completely different ways.</text>
<rect x="40" y="96" width="520" height="476" fill="#e3f4fb"/>
