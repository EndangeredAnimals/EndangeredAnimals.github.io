<ellipse cx="100" cy="310" rx="11" ry="9" fill="#4e2a84" fill-opacity="0.5" stroke="#4e2a84" stroke-width="2.5"/>
<text x="93.87878787878788" y="336.2322920830111" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#4e2a84" text-anchor="middle">the California</text>
<text x="93.87878787878788" y="350.2322920830111" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4e2a84" text-anchor="middle">coast</text>
<text x="524" y="214" font-family="Georgia, serif" font-size="12.5" font-weight="normal" fill="#2f7fa5" text-anchor="end">Atlantic</text>
<text x="524" y="230" font-family="Georgia, serif" font-size="12.5" font-weight="normal" fill="#2f7fa5" text-anchor="end">Ocean</text>
<text x="58" y="476" font-family="Georgia, serif" font-size="12.5" font-weight="normal" fill="#2f7fa5" text-anchor="start">Pacific Ocean</text>
<text x="604" y="128" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1f1f" text-anchor="start">Measured in hectares, not butterflies</text>
<text x="604" y="154" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">Nobody counts monarchs one by one. For</text>
<text x="604" y="173" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">the ones that winter in Mexico,</text>
<text x="604" y="192" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">scientists measure how much forest the</text>
<text x="604" y="211" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">butterflies cover when they all pile</text>
<text x="604" y="230" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">onto the trees.</text>
<line x1="604" y1="249" x2="944" y2="249" stroke="#e5e5e5" stroke-width="1.5"/>
<text x="604" y="271" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#2f7d4f" text-anchor="start">The best figure in years</text>
<text x="604" y="295" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">0.9 hectares in 2023 to 2024, then 1.79,</text>
<text x="604" y="314" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">then 2.93 in 2025 to 2026. That last</text>
<text x="604" y="333" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">jump is 64 percent. The record was</text>
<text x="604" y="352" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#414141" text-anchor="start">about 18 hectares in 1996 to 1997.</text>
<text x="604" y="385" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">The western monarchs are counted</text>
<text x="604" y="403" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">separately and are still in real</text>
<text x="604" y="421" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">trouble: millions in the 1980s, fewer</text>
<text x="604" y="439" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">than 2,000 in 2020, and around 9,000</text>
<text x="604" y="457" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6f6f6f" text-anchor="start">and 12,000 in the last two winters.</text>
<path d="M605 546 h26" stroke="#d8450b" stroke-width="4" stroke-linecap="round"/>
<text x="644" y="551" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#414141" text-anchor="start">The eastern migration, to Mexico</text>
<path d="M605 572 h26" stroke="#4e2a84" stroke-width="4" stroke-linecap="round"/>
<text x="644" y="577" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#414141" text-anchor="start">The western migration, to California</text>
<text x="40" y="596" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c8c">A simplified outline, not to scale. Monarchs breed right across the continent in summer; these arrows show where they spend the winter.</text>
</svg>